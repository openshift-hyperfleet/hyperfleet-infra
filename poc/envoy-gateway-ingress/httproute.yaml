# Route the hostname on the 443 listener to the echo backend, which makes the
# 1909 header checks observable (httpbin /headers shows what reached the
# backend). This route carries no route-level policy: the listener-scoped
# SecurityPolicy must authenticate it by default.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hyperfleet-api
  namespace: hyperfleet-oci-test
spec:
  parentRefs:
    - name: hyperfleet-poc
      sectionName: https
  hostnames:
    - api.oci.hypershell.app
  rules:
    - backendRefs:
        - name: echo-backend
          port: 80
