# Independent expectations for the deployment contract, not deployment inputs.
productionEntities:
  - kind: Cluster
    plural: clusters
    spec_schema_name: ClusterSpec
    references:
      - ref_type: wif_config
        target_kind: WifConfig
        min: 0
        max: 1
    name_min_len: 3
    name_max_len: 53
    require_spec_schema: true
  - kind: NodePool
    plural: nodepools
    parent_kind: Cluster
    on_parent_delete: cascade
    spec_schema_name: NodePoolSpec
    name_min_len: 3
    name_max_len: 15
    require_spec_schema: true
  - kind: Channel
    plural: channels
    spec_schema_name: ChannelSpec
  - kind: Version
    plural: versions
    parent_kind: Channel
    on_parent_delete: restrict
    spec_schema_name: VersionSpec
  - kind: WifConfig
    plural: wifconfigs
    spec_schema_name: WifConfigSpec
fixtureEntities:
  - kind: Parent
    plural: parents
  - kind: CascadeChild
    plural: cascadechildren
    parent_kind: Parent
    on_parent_delete: cascade
  - kind: RestrictChild
    plural: restrictchildren
    parent_kind: Parent
    on_parent_delete: restrict
  - kind: Referencer
    plural: referencers
    references:
      - ref_type: target
        target_kind: Target
        min: 0
        max: 1
  - kind: Target
    plural: targets
productionAdapters:
  clusters:
    - adapter1
    - adapter2
  nodepools:
    - adapter3
e2eAdapters:
  clusters:
    - cl-namespace
    - cl-job
    - cl-deployment
    - cl-desire
  nodepools:
    - np-configmap
  # Adapter-backed fixture kinds (HYPERFLEET-1729). The release name is also the
  # adapter identity: hyperfleet-infra renders required_adapters from the release
  # names, and the API matches adapter reports by that name.
  parents:
    - parents-success
  cascadechildren:
    - cascadechildren-success
probeEntities:
  - kind: AdapterProbe
    plural: adapterprobes
probeAdapters:
  adapterprobes:
    - probe-first
    - probe-second
  channels:
    - channel-probe
productionSentinels:
  - clusters
  - nodepools
e2eSentinels:
  - clusters
  - nodepools
  - parents
  - cascadechildren
# E2E-only machine callers that are not Helmfile Sentinel or adapter releases.
# Keep these independent of the deployment values so the allow-list check is exact.
e2eMachineServiceAccounts:
  - adapter-clusters-cl-stuck
  - adapter-clusters-cl-param-error
  - adapter-clusters-cl-crash
  - adapter-clusters-cl-invalid-resource
  - adapter-parents-adapter-failure
  - adapter-parents-adapter-crash
  - adapter-parents-adapter-stuck
  - adapter-parents-adapter-invalid-resource
  - hyperfleet-e2e-runner
probe: false
