# Default values for network-policies.
nameOverride: ""
fullnameOverride: ""

monitoringNamespace: monitoring

# Name/instance labels of the API this chart guards. Must match the
# `app.kubernetes.io/name` and `app.kubernetes.io/instance` labels rendered by
# the hyperfleet-api release (helmfile release name by default) — override these
# if it is installed under a different name or release instance.
apiNameLabel: hyperfleet-api
apiInstanceLabel: hyperfleet-api
# Name of the Gateway whose Envoy pods may reach the API. Envoy Gateway labels
# its proxy pods `gateway.envoyproxy.io/owning-gateway-name`, and the
# hyperfleet-gateway chart names its Gateway after the release, so this must equal
# the gateway release name.
gatewayName: hyperfleet-gateway

# Add or edit policies here — this is the only file that needs to change.
# `podSelector` and `ingress` are passed through `tpl`, so they can reference
# `.Values` (e.g. the labels above).
networkPolicies:
  - name: hyperfleet-api-ingress
    podSelector:
      app.kubernetes.io/name: "{{ .Values.apiNameLabel }}"
      app.kubernetes.io/instance: "{{ .Values.apiInstanceLabel }}"
      app.kubernetes.io/component: api
    ingress:
      # Sole ingress source for the API's app port: the gateway. No
      # sentinel/adapter exception — they reach the API through the gateway
      # (baseUrl defaults to http://hyperfleet-gateway:8000, the Service Envoy
      # Gateway generates for the Gateway).
      - from:
          - podSelector:
              matchLabels:
                gateway.envoyproxy.io/owning-gateway-name: "{{ .Values.gatewayName }}"
                gateway.envoyproxy.io/owning-gateway-namespace: "{{ .Values.namespace }}"
        ports:
          - protocol: TCP
            port: 8000
      # Prometheus metrics-only exception: the actual Prometheus pods
      # (not the whole monitoring namespace), scrape :9090 only.
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: "{{ .Values.monitoringNamespace }}"
            podSelector:
              matchLabels:
                app.kubernetes.io/name: prometheus
                operator.prometheus.io/name: kube-prometheus-stack-prometheus
        ports:
          - protocol: TCP
            port: 9090

  - name: hyperfleet-api-postgres-ingress
    podSelector:
      app.kubernetes.io/name: "{{ .Values.apiNameLabel }}"
      app.kubernetes.io/instance: "{{ .Values.apiInstanceLabel }}"
      app.kubernetes.io/component: postgresql
    ingress:
      - from:
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: "{{ .Values.apiNameLabel }}"
                app.kubernetes.io/instance: "{{ .Values.apiInstanceLabel }}"
                app.kubernetes.io/component: api
        ports:
          - protocol: TCP
            port: 5432
