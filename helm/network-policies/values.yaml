# Default values for network-policies.
nameOverride: ""
fullnameOverride: ""

monitoringNamespace: monitoring

# Name/instance labels of the API this chart guards. Must match the
# `app.kubernetes.io/name` and `app.kubernetes.io/instance` labels rendered by
# the hyperfleet-api release (helmfile release name by default) — override these
# if it is installed under a different name or release instance.
apiNameLabel: hyperfleet-api
apiInstanceLabel: hyperfleet-api

# Add or edit policies here — this is the only file that needs to change.
# `podSelector` and `ingress` are passed through `tpl`, so they can reference
# `.Values` (e.g. the labels above).
networkPolicies:
  - name: hyperfleet-api-ingress
    podSelector:
      app.kubernetes.io/name: "{{ .Values.apiNameLabel }}"
      app.kubernetes.io/instance: "{{ .Values.apiInstanceLabel }}"
      app.kubernetes.io/component: api
    ingress:
      # The API's app port is admitted by the NetworkPolicy the hyperfleet-gateway
      # chart renders for its upstream (`<release>-to-upstream`): the gateway is the
      # sole source, and there is no sentinel/adapter exception, because they reach
      # the API through the gateway (baseUrl defaults to http://hyperfleet-gateway:8000).
      # Prometheus metrics-only exception: the actual Prometheus pods
      # (not the whole monitoring namespace), scrape :9090 only.
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: "{{ .Values.monitoringNamespace }}"
            podSelector:
              matchLabels:
                app.kubernetes.io/name: prometheus
                operator.prometheus.io/name: kube-prometheus-stack-prometheus
        ports:
          - protocol: TCP
            port: 9090

  - name: hyperfleet-api-postgres-ingress
    podSelector:
      app.kubernetes.io/name: "{{ .Values.apiNameLabel }}"
      app.kubernetes.io/instance: "{{ .Values.apiInstanceLabel }}"
      app.kubernetes.io/component: postgresql
    ingress:
      - from:
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: "{{ .Values.apiNameLabel }}"
                app.kubernetes.io/instance: "{{ .Values.apiInstanceLabel }}"
                app.kubernetes.io/component: api
        ports:
          - protocol: TCP
            port: 5432
