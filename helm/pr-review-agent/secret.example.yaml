# Copy this file to a location outside Git, set the values, and apply it
# with kubectl. Do not commit the result.
apiVersion: v1
kind: Secret
metadata:
  name: pr-review-gateway
  namespace: pr-review-agent
type: Opaque
stringData:
  gateway-endpoint: https://gateway.example.com
  oidc-issuer: https://issuer.example.com/realms/hypershell
  oidc-client-id: replace-with-client-id
  oidc-audience: replace-with-audience
  oidc-client-secret: replace-with-client-secret
