# Release values for hyperfleet-api. Install with:
#   make install-pr-review-agent PR_REVIEW_REPO=api
repository: openshift-hyperfleet/hyperfleet-api
sandbox:
  # Sandbox names are limited to 19 characters, including a 4 character
  # suffix. The prefix and the discovery name must differ between releases.
  namePrefix: ha
  discoveryName: hfd-api
fullnameOverride: pr-review-api
