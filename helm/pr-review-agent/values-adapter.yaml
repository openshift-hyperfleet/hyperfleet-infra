# Release values for hyperfleet-adapter. Install with:
#   make install-pr-review-agent PR_REVIEW_REPO=adapter
repository: openshift-hyperfleet/hyperfleet-adapter
sandbox:
  # Sandbox names are limited to 19 characters, including a 4 character
  # suffix. The prefix and the discovery name must differ between releases.
  namePrefix: hd
  discoveryName: hfd-adp
fullnameOverride: pr-review-adapter
