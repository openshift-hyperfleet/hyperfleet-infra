# Release values for hyperfleet-sentinel. Install with:
#   make install-pr-review-agent PR_REVIEW_REPO=sentinel
repository: openshift-hyperfleet/hyperfleet-sentinel
sandbox:
  # Sandbox names are limited to 19 characters, including a 4 character
  # suffix. The prefix and the discovery name must differ between releases.
  namePrefix: hs
  discoveryName: hfd-snt
fullnameOverride: pr-review-sentinel
