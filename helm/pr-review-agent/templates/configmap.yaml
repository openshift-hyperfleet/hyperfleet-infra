apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pr-review-agent.fullname" . }}-runner
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pr-review-agent.labels" . | nindent 4 }}
data:
  {{- range list "run.sh" "discover.sh" "review.sh" "history.sh" "agent-runtime.sh" }}
  {{ . }}: |
    {{- $.Files.Get (printf "files/%s" .) | nindent 4 }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pr-review-agent.fullname" . }}-policy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pr-review-agent.labels" . | nindent 4 }}
data:
  discovery-policy.yaml: |
    {{- .Files.Get "files/discovery-policy.yaml" | nindent 4 }}
  policy.yaml: |
    {{- tpl (.Files.Get "files/policy.yaml") . | nindent 4 }}
