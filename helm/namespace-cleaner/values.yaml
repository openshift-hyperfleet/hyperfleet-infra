# Default values for namespace-cleaner

# alpine/k8s includes bash and kubectl, plus curl and jq for the orphan rules
image:
  repository: alpine/k8s@sha256:15cfdf84d6de3559bc54d7479eb4e8aadbf71f6d7f08782cb1e91f3446f4b2d8
  pullPolicy: IfNotPresent

# Cron schedule for the cleaner job (default: every hour)
schedule: "0 * * * *"

# Replace a previous run so a stale Job cannot block later schedules.
concurrencyPolicy: Replace

# Do not start a missed schedule after this delay.
startingDeadlineSeconds: 300

# Run the cleaner ahead of default-priority workloads when nodes are full.
priorityClassName: hyperfleet-critical

# Space-separated label selectors used to identify namespaces eligible for deletion.
# Each selector is matched independently (OR semantics).
labelSelector: "hyperfleet.io/cluster-id hyperfleet.io/test-run e2e.hyperfleet.io/run-id"

# Delete namespaces older than this many minutes
ageMinutes: 120

# When true, log what would be deleted without actually deleting anything
dryRun: false

# Orphan rules: delete Pub/Sub topics and subscriptions named "<run namespace>-*"
# and Helm-managed ClusterRoles and ClusterRoleBindings whose Helm release
# namespace is a run namespace, once that namespace no longer exists. Run
# namespaces are e2e-<19 digits> and rc-e2e-<19 digits>. Pub/Sub is reached with
# the pod's Workload Identity token, so the Kubernetes ServiceAccount needs to
# list and delete topics and subscriptions in pubsubProject. Every cluster that
# runs E2E against the same project sees the same topics, but only one has their
# run namespaces. A project-wide IAM grant does not tell clusters apart, so the
# cleaner checks the cluster name from the GKE metadata server against
# ownerCluster and skips Pub/Sub cleanup anywhere else. RBAC cleanup uses the
# local namespace list and runs independently of this check.
orphans:
  enabled: false
  # GCP project that holds the E2E Pub/Sub resources. Required when enabled.
  pubsubProject: ""
  # GKE cluster that runs the E2E jobs for pubsubProject. Required when enabled.
  ownerCluster: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi
