{{- include "hyperfleet-gateway.validateSecurity" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hyperfleet-gateway.fullname" . }}
  labels:
    {{- include "hyperfleet-gateway.labels" . | nindent 4 }}
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: listener_0
          address:
            socket_address:
              address: 0.0.0.0
              port_value: {{ .Values.service.port }}
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: ingress_http
                    early_header_mutation_extensions:
                      - name: envoy.http.early_header_mutation.header_mutation
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.http.early_header_mutation.header_mutation.v3.HeaderMutation
                          mutations:
                            {{- range .Values.envoy.stripHeaders }}
                            - remove: {{ . }}
                            {{- end }}
                    access_log:
                      - name: envoy.access_loggers.stdout
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                          log_format:
                            # Envoy's own default format, but PATH(NQ) instead of
                            # REQ(X-ENVOY-ORIGINAL-PATH?:PATH) so query strings -
                            # which may carry tokens or other secrets - aren't logged.
                            text_format_source:
                              inline_string: "[%START_TIME%] \"%REQ(:METHOD)% %PATH(NQ)% %PROTOCOL%\" %RESPONSE_CODE% %RESPONSE_FLAGS% %RESPONSE_CODE_DETAILS% %CONNECTION_TERMINATION_DETAILS% \"%UPSTREAM_TRANSPORT_FAILURE_REASON%\" %BYTES_RECEIVED% %BYTES_SENT% %DURATION% %RESP(X-ENVOY-UPSTREAM-SERVICE-TIME)% \"%REQ(X-FORWARDED-FOR)%\" \"%REQ(USER-AGENT)%\" \"%REQ(X-REQUEST-ID)%\" \"%REQ(:AUTHORITY)%\" \"%UPSTREAM_HOST%\"\n"
                    http_filters:
                      {{- if include "hyperfleet-gateway.edgeAuthEnabled" . }}
                      # ext_authz runs before the router: Authorino authenticates
                      # the request and injects trusted tenant headers, which the
                      # router then forwards upstream. Fail-closed and not
                      # configurable - this is the authentication boundary.
                      - name: envoy.filters.http.ext_authz
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                          transport_api_version: V3
                          failure_mode_allow: false
                          enable_dynamic_metadata_ingestion: true
                          grpc_service:
                            envoy_grpc:
                              cluster_name: authorino
                            timeout: {{ .Values.auth.extAuthz.timeout }}
                      {{- if eq .Values.auth.mode "EDGE+API" }}
                      # The wristband comes only from ext_authz dynamic metadata,
                      # never from a client-supplied HTTP header. Fail closed if
                      # Authorino returns OK without producing a wristband.
                      - name: envoy.filters.http.lua
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                          default_source_code:
                            inline_string: |
                              function envoy_on_request(handle)
                                local metadata = handle:streamInfo():dynamicMetadata():get("envoy.filters.http.ext_authz")
                                local token = metadata and metadata["wristband"]
                                if type(token) ~= "string" or token == "" then
                                  handle:respond({[":status"] = "403"}, "missing gateway wristband")
                                  return
                                end
                                handle:headers():replace("authorization", "Bearer " .. token)
                              end
                      {{- end }}
                      {{- end }}
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                    route_config:
                      name: local_route
                      virtual_hosts:
                        - name: upstream
                          domains:
                            - "*"
                          routes:
                            {{- if .Values.envoy.retryPolicy.enabled }}
                            # Retries only apply to methods that are safe to duplicate on the
                            # backend. POST (create) is excluded so a retried request can't
                            # surface as a spurious 409. PATCH is excluded too: a patch that
                            # includes "references" bumps the resource generation even when
                            # the references are unchanged, so retrying it isn't a no-op.
                            - match:
                                prefix: /
                                headers:
                                  - name: ":method"
                                    string_match:
                                      safe_regex:
                                        regex: "GET|HEAD|PUT|DELETE"
                              route:
                                cluster: upstream
                                timeout: {{ .Values.envoy.retryPolicy.timeout }}
                                retry_policy:
                                  retry_on: "{{ .Values.envoy.retryPolicy.retryOn }}"
                                  num_retries: {{ .Values.envoy.retryPolicy.numRetries }}
                                  per_try_timeout: {{ .Values.envoy.retryPolicy.perTryTimeout }}
                            {{- end }}
                            - match:
                                prefix: /
                              route:
                                cluster: upstream
      clusters:
        {{- if include "hyperfleet-gateway.edgeAuthEnabled" . }}
        - name: authorino
          connect_timeout: 3s
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          # Authorino's authorization API is gRPC, which requires HTTP/2 upstream.
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          load_assignment:
            cluster_name: authorino
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: {{ printf "%s-authorino-authorization" (include "hyperfleet-gateway.authorinoName" .) }}.{{ .Release.Namespace }}.svc.cluster.local
                          port_value: {{ .Values.auth.extAuthz.port }}
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              sni: {{ printf "%s-authorino-authorization.%s.svc" (include "hyperfleet-gateway.authorinoName" .) .Release.Namespace }}
              common_tls_context:
                validation_context:
                  trusted_ca:
                    filename: /etc/envoy/tls/ca.crt
                  match_typed_subject_alt_names:
                    - san_type: DNS
                      matcher:
                        exact: {{ printf "%s-authorino-authorization.%s.svc" (include "hyperfleet-gateway.authorinoName" .) .Release.Namespace }}
        {{- end }}
        - name: upstream
          connect_timeout: 10s
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              sni: {{ printf "%s.%s.svc" .Values.envoy.upstream.host .Release.Namespace }}
              common_tls_context:
                validation_context:
                  trusted_ca:
                    filename: /etc/envoy/tls/ca.crt
                  match_typed_subject_alt_names:
                    - san_type: DNS
                      matcher:
                        exact: {{ printf "%s.%s.svc" .Values.envoy.upstream.host .Release.Namespace }}
          load_assignment:
            cluster_name: upstream
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: {{ .Values.envoy.upstream.host }}.{{ .Release.Namespace }}.svc.cluster.local
                          port_value: {{ .Values.envoy.upstream.port }}
    admin:
      address:
        socket_address:
          address: 0.0.0.0
          port_value: {{ .Values.service.adminPort }}
      # Admin exposes destructive/sensitive endpoints (config_dump, logging, quitquitquit) by
      # default with no auth — restrict to what readiness probes and metrics scraping need.
      allow_paths:
        - exact: /ready
        - exact: /stats/prometheus
