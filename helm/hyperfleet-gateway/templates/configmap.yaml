apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hyperfleet-gateway.fullname" . }}
  labels:
    {{- include "hyperfleet-gateway.labels" . | nindent 4 }}
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: listener_0
          address:
            socket_address:
              address: 0.0.0.0
              port_value: {{ .Values.service.port }}
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: ingress_http
                    early_header_mutation_extensions:
                      - name: envoy.http.early_header_mutation.header_mutation
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.http.early_header_mutation.header_mutation.v3.HeaderMutation
                          mutations:
                            {{- range .Values.stripHeaders }}
                            - remove: {{ . }}
                            {{- end }}
                    http_filters:
                      {{- if .Values.extAuthz.enabled }}
                      # ext_authz runs before the router: Authorino authenticates
                      # the request and injects trusted tenant headers, which the
                      # router then forwards upstream. Fail-closed and not
                      # configurable - this is the authentication boundary.
                      - name: envoy.filters.http.ext_authz
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                          transport_api_version: V3
                          failure_mode_allow: false
                          grpc_service:
                            envoy_grpc:
                              cluster_name: authorino
                            timeout: {{ .Values.extAuthz.timeout }}
                      {{- end }}
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                    route_config:
                      name: local_route
                      virtual_hosts:
                        - name: upstream
                          domains:
                            - "*"
                          routes:
                            - match:
                                prefix: /
                              route:
                                cluster: upstream
      clusters:
        {{- if .Values.extAuthz.enabled }}
        - name: authorino
          connect_timeout: 0.25s
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          # Authorino's authorization API is gRPC, which requires HTTP/2 upstream.
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          load_assignment:
            cluster_name: authorino
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: {{ .Values.extAuthz.cluster }}.{{ .Release.Namespace }}.svc.cluster.local
                          port_value: {{ .Values.extAuthz.port }}
        {{- end }}
        - name: upstream
          connect_timeout: 1s
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: upstream
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: {{ .Values.upstream.host }}.{{ .Release.Namespace }}.svc.cluster.local
                          port_value: {{ .Values.upstream.port }}
    admin:
      address:
        socket_address:
          address: 0.0.0.0
          port_value: {{ .Values.service.adminPort }}
      # Admin exposes destructive/sensitive endpoints (config_dump, logging, quitquitquit) by
      # default with no auth — restrict to what readiness probes and metrics scraping need.
      allow_paths:
        - exact: /ready
        - exact: /stats/prometheus
