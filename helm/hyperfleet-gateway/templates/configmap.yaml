apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hyperfleet-gateway.fullname" . }}
  labels:
    {{- include "hyperfleet-gateway.labels" . | nindent 4 }}
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: listener_0
          address:
            socket_address:
              address: 0.0.0.0
              port_value: {{ .Values.service.port }}
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: ingress_http
                    early_header_mutation_extensions:
                      - name: envoy.http.early_header_mutation.header_mutation
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.http.early_header_mutation.header_mutation.v3.HeaderMutation
                          mutations:
                            {{- range .Values.stripHeaders }}
                            - remove: {{ . }}
                            {{- end }}
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                    route_config:
                      name: local_route
                      virtual_hosts:
                        - name: upstream
                          domains:
                            - "*"
                          routes:
                            {{- if .Values.retryPolicy.enabled }}
                            # Retries only apply to methods that are safe to duplicate on the
                            # backend. POST (create) is excluded so a retried request can't
                            # surface as a spurious 409. PATCH is excluded too: a patch that
                            # includes "references" bumps the resource generation even when
                            # the references are unchanged, so retrying it isn't a no-op.
                            - match:
                                prefix: /
                                headers:
                                  - name: ":method"
                                    string_match:
                                      safe_regex:
                                        regex: "GET|HEAD|PUT|DELETE"
                              route:
                                cluster: upstream
                                timeout: {{ .Values.retryPolicy.timeout }}
                                retry_policy:
                                  retry_on: "{{ .Values.retryPolicy.retryOn }}"
                                  num_retries: {{ .Values.retryPolicy.numRetries }}
                                  per_try_timeout: {{ .Values.retryPolicy.perTryTimeout }}
                            {{- end }}
                            - match:
                                prefix: /
                              route:
                                cluster: upstream
      clusters:
        - name: upstream
          connect_timeout: 1s
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: upstream
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: {{ .Values.upstream.host }}.{{ .Release.Namespace }}.svc.cluster.local
                          port_value: {{ .Values.upstream.port }}
    admin:
      address:
        socket_address:
          address: 0.0.0.0
          port_value: {{ .Values.service.adminPort }}
      # Admin exposes destructive/sensitive endpoints (config_dump, logging, quitquitquit) by
      # default with no auth — restrict to what readiness probes and metrics scraping need.
      allow_paths:
        - exact: /ready
        - exact: /stats/prometheus
