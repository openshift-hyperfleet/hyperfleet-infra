# Routes everything on the authenticated listeners to the upstream. The
# safe-to-repeat methods get their own named rule so the BackendTrafficPolicy can
# retry only them; every other method (POST, PATCH) falls through to the "default"
# rule, which is never retried. See traffic.retry in values.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "hyperfleet-gateway.fullname" . }}
  labels:
    {{- include "hyperfleet-gateway.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- range fromJsonArray (include "hyperfleet-gateway.authenticatedListeners" .) }}
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ include "hyperfleet-gateway.gatewayName" $ }}
      sectionName: {{ . }}
    {{- end }}
  rules:
    - name: idempotent
      matches:
        {{- range list "GET" "HEAD" "PUT" "DELETE" }}
        - method: {{ . }}
          path:
            type: PathPrefix
            value: /
        {{- end }}
      backendRefs:
        - name: {{ $.Values.upstream.host }}
          port: {{ $.Values.upstream.port }}
    - name: default
      matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Values.upstream.host }}
          port: {{ .Values.upstream.port }}
