{{- if include "hyperfleet-gateway.edgeAuthEnabled" . }}
# Authorino instance for Envoy ext_authz. Watches AuthConfigs in this namespace.
apiVersion: operator.authorino.kuadrant.io/v1beta1
kind: Authorino
metadata:
  name: {{ include "hyperfleet-gateway.authorinoName" . }}
  labels:
    {{- include "hyperfleet-gateway.labels" . | nindent 4 }}
spec:
  {{- if .Values.auth.authorino.image }}
  # Pin image; operator default may be unpublished on quay.
  image: {{ .Values.auth.authorino.image | quote }}
  {{- end }}
  listener:
    tls:
      enabled: true
      certSecretRef:
        name: {{ .Values.tls.authorinoAuthorizationTLSSecretName }}
  oidcServer:
    tls:
      enabled: true
      certSecretRef:
        name: {{ .Values.tls.authorinoOIDCTLSSecretName }}
  logLevel: {{ .Values.auth.authorino.logging.level }}
{{- end }}
