{{- $stale := include "hyperfleet-gateway.wristbandStaleKeys" . | fromJsonArray }}
{{- $jobs := list }}
{{- if $stale }}
{{- $jobs = append $jobs (dict "name" (include "hyperfleet-gateway.wristbandSweepName" .) "events" "post-install,post-upgrade" "keys" $stale) }}
{{- end }}
{{- if include "hyperfleet-gateway.authConfigEnabled" . }}
{{- include "hyperfleet-gateway.validate" . }}
{{- $jobs = append $jobs (dict "name" (include "hyperfleet-gateway.wristbandCleanupName" .) "events" "pre-delete" "keys" (concat (include "hyperfleet-gateway.wristbandSigningKeys" . | fromJsonArray) $stale | uniq)) }}
{{- end }}
# The sweep deletes the labeled keys the AuthConfig no longer lists, so it also
# removes the keys of a deployment that no longer lists them. The pre-delete
# Job covers uninstall. Neither waits for Authorino.
{{- range $i, $job := $jobs }}
{{- if $i }}
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $job.name }}
  labels:
    {{- include "hyperfleet-gateway.labels" $ | nindent 4 }}
  annotations:
    "helm.sh/hook": {{ $job.events | quote }}
    "helm.sh/hook-weight": "-3"
    "helm.sh/hook-delete-policy": "before-hook-creation,hook-succeeded"
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $job.name }}
  labels:
    {{- include "hyperfleet-gateway.labels" $ | nindent 4 }}
  annotations:
    "helm.sh/hook": {{ $job.events | quote }}
    "helm.sh/hook-weight": "-2"
    "helm.sh/hook-delete-policy": "before-hook-creation,hook-succeeded"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: {{ toJson $job.keys }}
    verbs: ["delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $job.name }}
  labels:
    {{- include "hyperfleet-gateway.labels" $ | nindent 4 }}
  annotations:
    "helm.sh/hook": {{ $job.events | quote }}
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": "before-hook-creation,hook-succeeded"
subjects:
  - kind: ServiceAccount
    name: {{ $job.name }}
    namespace: {{ $.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $job.name }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $job.name }}
  labels:
    {{- include "hyperfleet-gateway.labels" $ | nindent 4 }}
  annotations:
    "helm.sh/hook": {{ $job.events | quote }}
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": "before-hook-creation,hook-succeeded"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 60
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "hyperfleet-gateway.labels" $ | nindent 8 }}
    spec:
      serviceAccountName: {{ $job.name }}
      automountServiceAccountToken: true
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cleanup-signing-key
          image: {{ $.Values.authorino.wristbandHookImage | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: HOME
              value: /work
          command:
            - /bin/bash
            - -ec
            - |
              kubectl delete secret{{ range $job.keys }} {{ . | quote }}{{ end }} --ignore-not-found=true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: work
              mountPath: /work
      volumes:
        - name: work
          emptyDir: {}
{{- end }}
