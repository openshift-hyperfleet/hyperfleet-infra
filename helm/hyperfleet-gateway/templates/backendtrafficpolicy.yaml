{{- $rules := list (dict "name" "idempotent" "retry" true) (dict "name" "default" "retry" false) }}
# One policy per HTTPRoute rule: every rule gets the 45s request timeout, and the
# idempotent rule (GET, HEAD, PUT, DELETE) also gets up to 3 retries of 15s each.
{{- range $rules }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ include "hyperfleet-gateway.suffixedName" (dict "root" $ "suffix" .name) }}
  labels:
    {{- include "hyperfleet-gateway.labels" $ | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "hyperfleet-gateway.fullname" $ }}
      sectionName: {{ .name }}
  timeout:
    http:
      requestTimeout: 45s
  {{- if .retry }}
  retry:
    numRetries: 3
    perRetry:
      timeout: 15s
    retryOn:
      triggers:
        {{- range $.Values.traffic.retry.triggers }}
        - {{ . }}
        {{- end }}
  {{- end }}
{{- end }}
