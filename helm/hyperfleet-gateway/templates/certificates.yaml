{{- $authorinoAuthorizationServiceName := printf "%s-authorino-authorization" (include "hyperfleet-gateway.authorinoName" .) -}}
{{- $authorinoOIDCServiceName := printf "%s-authorino-oidc" (include "hyperfleet-gateway.authorinoName" .) -}}
{{- $rootSelfSignedIssuerName := printf "%s-selfsigned" (include "hyperfleet-gateway.fullname" .) -}}
{{- $rootCAIssuerName := printf "%s-ca" (include "hyperfleet-gateway.fullname" .) -}}
{{- $rootCACertificateName := $rootCAIssuerName -}}
{{- $rootCASecretName := include "hyperfleet-gateway.rootCASecretName" . -}}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ $rootSelfSignedIssuerName }}
  labels:
    {{- include "hyperfleet-gateway.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $rootCACertificateName }}
  labels:
    {{- include "hyperfleet-gateway.labels" . | nindent 4 }}
spec:
  commonName: HyperFleet Gateway Root CA
  subject:
    organizations:
      - HyperFleet
  isCA: true
  duration: 87600h
  secretName: {{ $rootCASecretName }}
  # HYPERFLEET-1523: CA renewal and rollover are explicitly deferred to the
  # certificate-rotation spike. Keep this existing non-rotating root stable.
  renewal:
    policy: Disabled
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 4096
    rotationPolicy: Never
  issuerRef:
    kind: Issuer
    name: {{ $rootSelfSignedIssuerName }}
  usages:
    - digital signature
    - cert sign
    - crl sign
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ $rootCAIssuerName }}
  labels:
    {{- include "hyperfleet-gateway.labels" . | nindent 4 }}
spec:
  ca:
    secretName: {{ $rootCASecretName }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $authorinoAuthorizationServiceName }}
  labels:
    {{- include "hyperfleet-gateway.labels" . | nindent 4 }}
spec:
  secretName: {{ include "hyperfleet-gateway.authorinoAuthorizationTLSSecretName" . }}
  privateKey:
    # HYPERFLEET-1523: this pre-existing leaf-key rotation policy is outside
    # this PR. Do not change rotation behaviour until the spike decides it.
    rotationPolicy: Always
  issuerRef:
    name: {{ $rootCAIssuerName }}
    kind: Issuer
    group: cert-manager.io
  dnsNames:
    - {{ $authorinoAuthorizationServiceName }}
    - {{ printf "%s.%s.svc" $authorinoAuthorizationServiceName .Release.Namespace }}
    - {{ printf "%s.%s.svc.cluster.local" $authorinoAuthorizationServiceName .Release.Namespace }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $authorinoOIDCServiceName }}
  labels:
    {{- include "hyperfleet-gateway.labels" . | nindent 4 }}
spec:
  secretName: {{ include "hyperfleet-gateway.authorinoOIDCTLSSecretName" . }}
  privateKey:
    # HYPERFLEET-1523: this pre-existing leaf-key rotation policy is outside
    # this PR. Do not change rotation behaviour until the spike decides it.
    rotationPolicy: Always
  issuerRef:
    name: {{ $rootCAIssuerName }}
    kind: Issuer
    group: cert-manager.io
  dnsNames:
    - {{ $authorinoOIDCServiceName }}
    - {{ printf "%s.%s.svc" $authorinoOIDCServiceName .Release.Namespace }}
    - {{ printf "%s.%s.svc.cluster.local" $authorinoOIDCServiceName .Release.Namespace }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.upstream.host }}
  labels:
    {{- include "hyperfleet-gateway.labels" . | nindent 4 }}
spec:
  secretName: {{ include "hyperfleet-gateway.upstreamTLSSecretName" . }}
  privateKey:
    # HYPERFLEET-1523: this pre-existing leaf-key rotation policy is outside
    # this PR. Do not change rotation behaviour until the spike decides it.
    rotationPolicy: Always
  issuerRef:
    name: {{ $rootCAIssuerName }}
    kind: Issuer
    group: cert-manager.io
  dnsNames:
    - {{ .Values.upstream.host }}
    - {{ printf "%s.%s.svc" .Values.upstream.host .Release.Namespace }}
    - {{ printf "%s.%s.svc.cluster.local" .Values.upstream.host .Release.Namespace }}
