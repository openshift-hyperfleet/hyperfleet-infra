# Removes client-supplied identity and tenant headers before anything else sees
# them. earlyRequestHeaders is the only header mechanism that runs before the
# authorization filter, so a forged header can never reach Authorino or the API.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: {{ include "hyperfleet-gateway.fullname" . }}
  labels:
    {{- include "hyperfleet-gateway.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ include "hyperfleet-gateway.gatewayName" . }}
  headers:
    earlyRequestHeaders:
      remove:
        {{- range fromJsonArray (include "hyperfleet-gateway.stripHeaders" .) }}
        - {{ . }}
        {{- end }}
