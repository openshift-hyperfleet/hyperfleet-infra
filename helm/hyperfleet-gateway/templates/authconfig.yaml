{{- if include "hyperfleet-gateway.edgeAuthEnabled" . }}
{{- $model := .Values.tenant.model | default "onprem" }}
{{- $cfg := index .Values.tenant.models $model }}
{{- if not $cfg }}
{{- fail (printf "tenant.model %q not found in .Values.tenant.models (expected e.g. onprem|oracle)" $model) }}
{{- end }}
{{- if not .Values.auth.machineIdentity.allowedServiceAccounts }}
{{- fail "auth.machineIdentity.allowedServiceAccounts must not be empty" }}
{{- end }}
{{- if not .Values.auth.machineIdentity.audience }}
{{- fail "auth.machineIdentity.audience must not be empty" }}
{{- end }}
{{- if not .Values.auth.identityProviders }}
{{- fail "auth.identityProviders must contain at least one human identity provider in edge modes" }}
{{- end }}
{{- $allowedServiceAccountsPattern := list }}
{{- range .Values.auth.machineIdentity.allowedServiceAccounts }}
{{- $allowedServiceAccountsPattern = append $allowedServiceAccountsPattern (regexQuoteMeta .) }}
{{- end }}
{{- $providerNames := dict }}
{{- $providerIssuers := dict }}
{{- range .Values.auth.identityProviders }}
{{- if or (not .name) (eq .name "hyperfleet-components") }}
{{- fail "Identity providers need a unique name other than hyperfleet-components" }}
{{- end }}
{{- if hasKey $providerNames .name }}
{{- fail (printf "Duplicate identity provider name %q" .name) }}
{{- end }}
{{- $_ := set $providerNames .name true }}
{{- if and (not (regexMatch "^https://[^/]+" .issuerUrl)) (not (and .allowInsecureIssuer (regexMatch "^http://[^/]+" .issuerUrl))) }}
{{- fail (printf "Identity provider %q requires an HTTPS issuerUrl (or an explicit test-only HTTP issuer)" .name) }}
{{- end }}
{{- if hasKey $providerIssuers .issuerUrl }}
{{- fail (printf "Duplicate identity provider issuerUrl %q" .issuerUrl) }}
{{- end }}
{{- $_ = set $providerIssuers .issuerUrl true }}
{{- if not .audience }}
{{- fail (printf "Identity provider %q requires an audience" .name) }}
{{- end }}
{{- end }}
# Gateway auth policy (stable name; tenant model swap replaces in place).
apiVersion: authorino.kuadrant.io/v1beta3
kind: AuthConfig
metadata:
  name: hyperfleet-tenant-policy
  labels:
    {{- include "hyperfleet-gateway.labels" . | nindent 4 }}
spec:
  # Matched request authority: always the gateway Service DNS + localhost,
  # plus any extra hostnames configured via authorino.hosts (AUTHORINO_HOSTS).
  hosts:
    - {{ include "hyperfleet-gateway.fullname" . | quote }}
    - {{ printf "%s.%s.svc" (include "hyperfleet-gateway.fullname" .) .Release.Namespace | quote }}
    - {{ printf "%s.%s.svc.cluster.local" (include "hyperfleet-gateway.fullname" .) .Release.Namespace | quote }}
    - "localhost"
    {{- range .Values.auth.authorino.hosts }}
    - {{ . | quote }}
    {{- end }}
  authentication:
    # The authorization scheme selects exactly one authentication method. This
    # avoids both a TokenReview on every human request and issuer collisions
    # between Kubernetes ServiceAccount tokens and human JWTs.
    "hyperfleet-components":
      when:
        - predicate: request.headers['authorization'].startsWith('ServiceAccount ')
      kubernetesTokenReview:
        audiences:
          - {{ .Values.auth.machineIdentity.audience | quote }}
      credentials:
        authorizationHeader:
          prefix: ServiceAccount
      overrides:
        hf_system:
          value: "true"
    {{- range .Values.auth.identityProviders }}
    {{ .name | quote }}:
      when:
        - predicate: request.headers['authorization'].startsWith('Bearer ')
      jwt:
        issuerUrl: {{ .issuerUrl | quote }}
      credentials:
        authorizationHeader:
          prefix: Bearer
      overrides:
        hf_system:
          value: "false"
        hf_identity:
          expression: {{ printf "auth.identity[%s]" (default "sub" .identityClaim | toJson) | quote }}
    {{- end }}
  authorization:
    # Human requests must produce a usable audit identity. Machine callers are
    # identified and restricted by their Kubernetes ServiceAccount instead.
    require-identity:
      when:
        - selector: auth.identity.hf_system
          operator: neq
          value: "true"
      patternMatching:
        patterns:
          - selector: auth.identity.hf_identity
            operator: neq
            value: ""
    {{- range .Values.auth.identityProviders }}
    {{ printf "%s-audience" .name | quote }}:
      when:
        - selector: auth.identity.iss
          operator: eq
          value: {{ .issuerUrl | quote }}
      patternMatching:
        patterns:
          - predicate: {{ printf "has(auth.identity.aud) && (type(auth.identity.aud) == string ? auth.identity.aud == %s : %s in auth.identity.aud)" (.audience | toJson) (.audience | toJson) | quote }}
    {{- if .identityClaimPattern }}
    {{ printf "%s-identity" .name | quote }}:
      when:
        - selector: auth.identity.iss
          operator: eq
          value: {{ .issuerUrl | quote }}
      patternMatching:
        patterns:
          - selector: auth.identity.hf_identity
            operator: matches
            value: {{ .identityClaimPattern | quote }}
    {{- end }}
    {{- end }}
    # Machine callers only: allow only the exact SAs listed in
    # auth.machineIdentity.allowedServiceAccounts, in this namespace.
    # Audience alone is not the credential.
    "restrict-system-subjects":
      when:
        - selector: auth.identity.hf_system
          operator: eq
          value: "true"
      patternMatching:
        patterns:
          - selector: auth.identity.user.username
            operator: matches
            value: {{ printf "^system:serviceaccount:%s:(%s)$" .Release.Namespace ($allowedServiceAccountsPattern | join "|") | quote }}
    # Required tenant claim must be non-empty.
    {{ $cfg.requiredRule | quote }}:
      when:
        - selector: auth.identity.hf_system
          operator: neq
          value: "true"
      patternMatching:
        patterns:
          - selector: auth.identity.{{ $cfg.required.claim }}
            operator: neq
            value: ""
  response:
    success:
      {{- if eq .Values.auth.mode "EDGE+API" }}
      dynamicMetadata:
        wristband:
          wristband:
            issuer: {{ include "hyperfleet-gateway.wristbandIssuer" . | quote }}
            tokenDuration: {{ .Values.auth.wristband.tokenDuration }}
            signingKeyRefs:
              - name: {{ .Values.auth.wristband.signingKeySecretName }}
                algorithm: RS256
            customClaims:
              aud:
                value: {{ .Values.auth.wristband.audience | quote }}
              sub:
                expression: "auth.identity.hf_system == 'true' ? auth.identity.user.username : auth.identity.hf_identity"
              hf_identity:
                selector: auth.identity.hf_identity
              hf_system:
                selector: auth.identity.hf_system
              {{ $cfg.required.claim | quote }}:
                expression: {{ printf "%s in auth.identity ? auth.identity[%s] : ''" ($cfg.required.claim | toJson) ($cfg.required.claim | toJson) | quote }}
              {{ $cfg.optional.claim | quote }}:
                expression: {{ printf "%s in auth.identity ? auth.identity[%s] : ''" ($cfg.optional.claim | toJson) ($cfg.optional.claim | toJson) | quote }}
      {{- end }}
      headers:
        {{- if eq .Values.auth.mode "EDGE" }}
        # Rewrite the machine credential only after successful authentication.
        # EDGE+API replaces all credentials with a wristband in Envoy.
        Authorization:
          when:
            - predicate: request.headers['authorization'].startsWith('ServiceAccount ')
          plain:
            expression: "request.headers['authorization'].replace('ServiceAccount ', 'Bearer ')"
        {{- end }}
        # "true" for machine callers (hyperfleet-components), "false" for humans.
        x-hyperfleet-system:
          plain:
            selector: auth.identity.hf_system
        x-hyperfleet-identity:
          # when-gated: machine callers have no email claim (avoids "<nil>").
          when:
            - selector: auth.identity.email
              operator: neq
              value: ""
          plain:
            selector: auth.identity.email
        {{ $cfg.required.header | quote }}:
          # when-gated: machine callers are exempt from the required claim (see
          # the {{ $cfg.requiredRule }} authorization rule above) and have no
          # claim to put here (avoids "<nil>").
          when:
            - selector: auth.identity.{{ $cfg.required.claim }}
              operator: neq
              value: ""
          plain:
            selector: auth.identity.{{ $cfg.required.claim }}
        {{ $cfg.optional.header | quote }}:
          # when-gated: omit optional header when claim absent (avoids "<nil>").
          when:
            - selector: auth.identity.{{ $cfg.optional.claim }}
              operator: neq
              value: ""
          plain:
            selector: auth.identity.{{ $cfg.optional.claim }}
{{- end }}
