# Default values for hyperfleet-gateway
#
# The chart renders Gateway API resources for Envoy Gateway (ADR-0036) and, when
# authentication is on, the Authorino instance and AuthConfig that go with them.
# The Envoy Gateway controller is a cluster prerequisite installed by
# `make install-envoy-gateway`. Everything is named from the release, so a
# second gateway is a second release of this chart.
#
# Only what differs between environments or gateways is a value. Policy that
# does not (timeouts, retry counts, the security contexts, the PodDisruptionBudget,
# the ext_authz port) is written into the templates.

nameOverride: ""
fullnameOverride: ""

# -----------------------------------------------------------------------------
# The gateway: Envoy Gateway resources
# -----------------------------------------------------------------------------
# The GatewayClass the Gateway uses. It is cluster-scoped and shared, so the chart
# does not render it: `make install-envoy-gateway` creates it with the controller.
gatewayClassName: hyperfleet

# The Gateway, its EnvoyProxy and the Envoy Deployment and pods are named after the
# release.
gateway:
  listeners:
    - name: http
      port: 8000
      protocol: HTTP
      # hostname: ""
      # tls: {}
      # Routes and authentication attach to every listener except one marked
      # `authenticated: false` (the ACME HTTP-01 solver listener, HYPERFLEET-1912).
      # authenticated: true

# Backend the HTTPRoute sends to. The API serves TLS from the internal CA.
upstream:
  host: hyperfleet-api
  port: 8000
  # Secret holding the upstream's serving certificate. Default: "<host>-server-cert".
  # tlsSecretName: ""
  # Labels of the pods behind `host`. Required: there is no default, because Helm merges
  # maps, so a default would leak its labels into whatever a release sets. The
  # NetworkPolicy this chart renders admits this gateway's Envoy pods to these pods on
  # `port`. Helmfile sets the API's labels for the API gateway; a release with another
  # upstream (the Desire Store) sets its own.
  podSelector: {}

envoyProxy:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # trace | debug | info | warn | error | critical | off
  logLevel: info
  # The generated Service is what in-cluster callers reach (Sentinel, adapters).
  # It is named after the release, so the default stays hyperfleet-gateway:8000.
  service:
    type: ClusterIP
    annotations: {}

# Client-supplied headers are removed before authorization runs, because they carry
# identity and tenant claims. The tenant headers of both models, x-hyperfleet-system
# and x-hyperfleet-identity are always removed and cannot be taken off the list;
# stripOverride adds more headers to it.
headers:
  stripOverride: []

traffic:
  # Only GET, HEAD, PUT and DELETE are retried (fixed in the HTTPRoute): they are
  # safe to duplicate on the backend. POST (create) is excluded so a retried
  # request can't surface as a spurious 409, and so is PATCH: a patch that
  # includes "references" bumps the resource generation even when the references
  # are unchanged, so retrying it isn't a no-op.
  retry:
    triggers:
      - connect-failure
      - refused-stream
      - reset
      - gateway-error

monitoring:
  podMonitor:
    enabled: false

# Helm cannot natively wait for cert-manager Certificate custom resources. A
# post-install/upgrade Job blocks dependent Helmfile releases until the Secrets
# consumed by Envoy, Authorino, and the upstream are issued.
certificateWaiter:
  image:
    repository: alpine/k8s@sha256:15cfdf84d6de3559bc54d7479eb4e8aadbf71f6d7f08782cb1e91f3446f4b2d8
    pullPolicy: IfNotPresent
  timeoutSeconds: 300
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# -----------------------------------------------------------------------------
# Authorino: the ext_authz service, its instance, and the policy it enforces
# -----------------------------------------------------------------------------
authorino:
  # Name of the Authorino instance. The operator derives its Services and
  # ServiceAccount from it, and so do the certificate Secrets
  # ("<name>-server-cert", "<name>-oidc-server-cert"): a second gateway in the
  # same namespace needs a different name.
  name: authorino
  # Pin the runtime; the Makefile pins the operator CRD that supports its
  # AuthConfig schema.
  image: quay.io/kuadrant/authorino:v0.28.0
  logLevel: info
  # Extra hostnames the AuthConfig answers for. Empty: the gateway Service DNS
  # names and localhost (see authconfig.yaml).
  hosts: []
  # Label selector (Authorino syntax) restricting which AuthConfigs this instance
  # loads, so two Authorino instances stay disjoint. The AuthConfig this chart renders
  # carries hyperfleet.io/gateway=general, so the default selects exactly that and
  # nothing else in the namespace; a release whose AuthConfigs come from elsewhere (the
  # Desire Store: hyperfleet.io/desire-store) sets its own. Empty would select every
  # AuthConfig in the namespace. Only key, !key, key=value and key!=value terms,
  # separated by commas, are accepted: Authorino treats a selector it cannot parse as
  # matching everything, so a typo would silently load every AuthConfig.
  authConfigLabelSelectors: hyperfleet.io/gateway=general
  # Test-only CA mounted into Authorino's Go system trust directory when Helmfile
  # selects the self-signed mock issuer over HTTPS.
  mockIssuerCASecretName: ""
  # Image of the Jobs that create and delete the wristband signing-key Secrets
  # (kubectl and openssl). Pinned by digest. It is read whenever a hook renders,
  # including the sweep of keys a release with `policy: null` leaves behind, so it
  # is set whether or not the release has a policy.
  wristbandHookImage: bitnami/kubectl:1.33.4-debian-12-r0@sha256:ed0b31a0508da84ee655c5c6e01bd3897fc56ad6cf69debb27fa1893a06d2246
  # The header the wristband leaves in, toward the upstream. The caller's credential
  # always arrives in `authorization`. The default, `authorization`, writes
  # "Bearer <wristband>" over it. Any other name (x-wristband) carries the raw token,
  # and the caller's `authorization` header is deleted after authorization: the
  # upstream receives the wristband in that one header and nothing else. A custom name
  # is also removed from client requests before authorization, so it cannot be forged.
  # The token comes from ext_authz metadata or, for a custom name, from the header
  # Authorino itself set; with neither the request is denied.
  wristbandHeader: authorization

  # The AuthConfig this chart renders. Set `policy: null` for a gateway whose
  # AuthConfigs come from elsewhere (an operator): no AuthConfig is rendered then.
  policy:
    # At least one is required. Helmfile supplies the human provider.
    identityProviders: []
    # - name: human-jwt
    #   issuerUrl: https://idp.example.com/realms/hyperfleet
    #   allowInsecureIssuer: false # test-only mock issuer exception
    #   audience: hyperfleet-api
    #   identityClaim: sub
    #   identityClaimPattern: ""

    # Machine identity (adapters/sentinels) via kubernetesTokenReview.
    machineIdentity:
      # Dedicated TokenReview audience; must match the adapter/sentinel auth.audience values.
      audience: hyperfleet-api
      # Exact service account names allowed as machine callers (no wildcards): only
      # these SAs in this namespace are trusted, so an unrelated component can't be
      # granted access just by matching a naming convention. helmfile/values/base-gateway.yaml.gotmpl
      # derives this list from .Values.sentinels/.Values.adapters so it stays in sync
      # with the releases actually deployed per environment; these are standalone-chart defaults.
      allowedServiceAccounts:
        - clusters-hyperfleet-sentinel
        - nodepools-hyperfleet-sentinel
        - adapter1-hyperfleet-adapter
        - adapter2-hyperfleet-adapter
        - adapter3-hyperfleet-adapter

    # Active AuthConfig model (onprem|oracle). Keep in sync with base-api tenant dimensions.
    tenant:
      model: onprem

    # Festival Wristband settings. A chart hook creates the
    # signing Secret in-cluster before the AuthConfig is installed. The Secret
    # contains key.pem, a traditional PKCS#1 RSA private key required by the
    # pinned Authorino version, and is separate from every TLS private key.
    # The AuthConfig lists the trusted keys and the first one signs. The label
    # hyperfleet.io/wristband-signing-key only marks the Secrets the hooks may
    # delete. make rotate-wristband-key manages the list.
    wristband:
      # Audience the API validates; it must match the API chart's configuration.
      audience: hyperfleet-api
      # Name of the key created on a fresh install. Rotated keys get new names
      # because the name is the JWT key ID.
      signingKeySecretName: hyperfleet-wristband-signing-key
      # Set only by make rotate-wristband-key, signer first. Empty keeps the keys
      # the AuthConfig already lists.
      signingKeys: []
