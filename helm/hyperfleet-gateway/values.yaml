# Default values for hyperfleet-gateway

# -----------------------------------------------------------------------------
# Naming
# -----------------------------------------------------------------------------
nameOverride: ""
fullnameOverride: ""

# -----------------------------------------------------------------------------
# Image
# -----------------------------------------------------------------------------
image:
  registry: ""
  repository: envoyproxy/envoy
  tag: v1.39.1
  pullPolicy: IfNotPresent

imagePullSecrets: []

# -----------------------------------------------------------------------------
# Deployment — Kubernetes workload settings (Pod/Deployment specific)
# -----------------------------------------------------------------------------
deployment:
  replicaCount: 2

  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1

  probes:
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 5
    liveness:
      initialDelaySeconds: 10
      periodSeconds: 10
      failureThreshold: 3

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Defaults to a preferred anti-affinity spreading replicas across nodes
  affinity: {}

  nodeSelector: {}
  tolerations: []

  podAnnotations: {}
  podLabels: {}

  serviceAccount:
    create: true
    name: ""
    annotations: {}

  podSecurityContext:
    fsGroup: 65532
    runAsNonRoot: true
    runAsUser: 65532

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    seccompProfile:
      type: RuntimeDefault

# -----------------------------------------------------------------------------
# Service — Kubernetes Service settings
# -----------------------------------------------------------------------------
service:
  type: ClusterIP
  port: 8000
  adminPort: 9901
  annotations: {}

tls:
  hyperfleetApiTLSSecretName: hyperfleet-api-server-cert
  authorinoAuthorizationTLSSecretName: authorino-server-cert
  authorinoOIDCTLSSecretName: authorino-oidc-server-cert
  # Helm cannot natively wait for cert-manager Certificate custom resources.
  # A post-install/upgrade Job blocks dependent Helmfile releases until the
  # Secrets consumed by Envoy, Authorino, and hyperfleet-api are issued.
  certificateWaiter:
    enabled: true
    image:
      repository: alpine/k8s@sha256:15cfdf84d6de3559bc54d7479eb4e8aadbf71f6d7f08782cb1e91f3446f4b2d8
      pullPolicy: IfNotPresent
    timeoutSeconds: 300
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

# -----------------------------------------------------------------------------
# Envoy — gateway/proxy behavior knobs that are customized
# per deployment/environment. The rest of the Envoy configuration lives
# directly in templates/configmap.yaml.
# -----------------------------------------------------------------------------
envoy:
  # Backend hyperfleet-api is proxied to
  upstream:
    host: hyperfleet-api
    port: 8000

  # Strip forged identity/tenant headers before ext_authz.
  stripHeaders:
    - x-tenant-org
    - x-tenant-project
    - x-tenant-tenancy-ocid
    - x-tenant-compartment
    - x-hyperfleet-system
    - x-hyperfleet-identity

  retryPolicy:
    enabled: true
    retryOn: connect-failure,refused-stream,reset,gateway-error
    numRetries: 3
    perTryTimeout: 15s
    timeout: 45s

  logging:
    level: info

# -----------------------------------------------------------------------------
# Authentication — Authorino ext_authz gateway and OIDC settings
# -----------------------------------------------------------------------------
auth:
  # NONE: no authentication; EDGE: Authorino; API: in-app external JWTs;
  # EDGE+API: Authorino exchanges external credentials for API-only wristbands.
  mode: NONE
  # Authorino ext_authz (requires make install-authorino-operator).
  extAuthz:
    port: 50051
    timeout: 1s

  # Rendered in EDGE and EDGE+API.
  authorino:
    # Pin published image; align with AUTHORINO_OPERATOR_VERSION in Makefile.
    image: quay.io/kuadrant/authorino:v0.26.2
    # Empty: gateway Service DNS + localhost (see authconfig.yaml).
    hosts: []
    # Test-only CA mounted into Authorino's Go system trust directory when
    # Helmfile selects the self-signed mock issuer over HTTPS.
    mockIssuerCASecretName: ""
    logging:
      level: info

  # Required in EDGE and EDGE+API modes. Helmfile supplies the human provider.
  identityProviders: []
  # - name: human-jwt
  #   issuerUrl: https://idp.example.com/realms/hyperfleet
  #   allowInsecureIssuer: false # test-only mock issuer exception
  #   audience: hyperfleet-api
  #   identityClaim: sub
  #   identityClaimPattern: ""

  # Fixed Festival Wristband settings. The signing Secret contains key.pem
  # (traditional PKCS#1 RSA private key, required by the pinned Authorino
  # version) and is provisioned once by
  # make ensure-wristband-signing-key. It is separate from every TLS private key.
  # HYPERFLEET-1523 owns any signing-key rotation design; this PR preserves it.
  wristband:
    signingKeySecretName: hyperfleet-wristband-signing-key
    audience: hyperfleet-api
    tokenDuration: 300

  # Machine identity (adapters/sentinels) via kubernetesTokenReview - see authconfig.yaml.
  machineIdentity:
    # Dedicated TokenReview audience; must match the adapter/sentinel auth.audience values.
    audience: hyperfleet-api
    # Exact service account names allowed as machine callers (no wildcards): only
    # these SAs in this namespace are trusted, so an unrelated component can't be
    # granted access just by matching a naming convention. helmfile/values/base-gateway.yaml.gotmpl
    # derives this list from .Values.sentinels/.Values.adapters so it stays in sync
    # with the releases actually deployed per environment; these are standalone-chart defaults.
    allowedServiceAccounts:
      - clusters-hyperfleet-sentinel
      - nodepools-hyperfleet-sentinel
      - adapter1-hyperfleet-adapter
      - adapter2-hyperfleet-adapter
      - adapter3-hyperfleet-adapter

# -----------------------------------------------------------------------------
# Tenant — active AuthConfig model and per-model claim->header mappings
# -----------------------------------------------------------------------------
tenant:
  # Active AuthConfig model (onprem|oracle). Keep in sync with base-api tenant dimensions.
  model: onprem

  models:
    onprem:
      requiredRule: require-org
      required:
        claim: org_id
        header: x-tenant-org
      optional:
        claim: project_id
        header: x-tenant-project
    oracle:
      requiredRule: require-tenancy-ocid
      required:
        claim: tenancy_ocid
        header: x-tenant-tenancy-ocid
      optional:
        claim: compartment_id
        header: x-tenant-compartment

# -----------------------------------------------------------------------------
# Monitoring — scrape Envoy's built-in /stats/prometheus endpoint
# -----------------------------------------------------------------------------
monitoring:
  serviceMonitor:
    enabled: false
