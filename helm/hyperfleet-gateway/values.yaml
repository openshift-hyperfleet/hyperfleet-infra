# Default values for hyperfleet-gateway. The Envoy Gateway controller is a
# cluster prerequisite (`make install-envoy-gateway`); everything is named from
# the release, so a second gateway is a second release of this chart. Only what
# differs between environments or gateways is a value; the rest is in the templates.

nameOverride: ""
fullnameOverride: ""

# -----------------------------------------------------------------------------
# The gateway: Envoy Gateway resources
# -----------------------------------------------------------------------------
# Cluster-scoped and shared; created by `make install-envoy-gateway`, not this chart.
gatewayClassName: hyperfleet

gateway:
  listeners:
    - name: http
      port: 8000
      protocol: HTTP
      # hostname: ""
      # tls: {}
      # Routes and authentication attach to every listener except one marked
      # `authenticated: false` (the ACME HTTP-01 solver listener, HYPERFLEET-1912).
      # authenticated: true

# Backend the HTTPRoute sends to; every field is required with no default.
upstream:
  # Secret holding the upstream's serving certificate. Default: "<host>-server-cert".
  # tlsSecretName: ""
  # Labels of the pods behind `host`; the NetworkPolicy admits this gateway's Envoy
  # pods to them. No default: Helm merges maps, so one would leak into a release's
  # own selector.
  podSelector: {}

envoyProxy:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # trace | debug | info | warn | error | critical | off
  logLevel: info
  service:
    type: ClusterIP
    annotations: {}

# Extra client-supplied headers to strip before authorization; the identity and
# tenant headers are always stripped.
headers:
  stripOverride: []

traffic:
  # Only idempotent methods are retried; POST would surface a spurious 409 and
  # PATCH can bump the resource generation without changing anything.
  retry:
    triggers:
      - connect-failure
      - refused-stream
      - reset
      - gateway-error

monitoring:
  podMonitor:
    enabled: false

# A post-install/upgrade Job blocks dependent releases until cert-manager has
# issued the certificate Secrets.
certificateWaiter:
  image:
    repository: alpine/k8s@sha256:15cfdf84d6de3559bc54d7479eb4e8aadbf71f6d7f08782cb1e91f3446f4b2d8
    pullPolicy: IfNotPresent
  timeoutSeconds: 300
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# -----------------------------------------------------------------------------
# Authorino: the ext_authz service, its instance, and the policy it enforces
# -----------------------------------------------------------------------------
authorino:
  # A second gateway in the same namespace needs a different instance name.
  name: authorino
  # The Makefile pins the operator CRD supporting this version's AuthConfig schema.
  image: quay.io/kuadrant/authorino:v0.28.0
  logLevel: info
  # Extra hostnames the AuthConfig answers for beyond the Service DNS and localhost.
  hosts: []
  # Restricts which AuthConfigs this instance loads, so two Authorinos stay disjoint.
  # Only key, !key, key=value and key!=value terms: Authorino treats an unparseable
  # selector as matching everything.
  authConfigLabelSelectors: hyperfleet.io/gateway=general
  # Test-only CA for the mock issuer, mounted into Authorino's trust store.
  mockIssuerCASecretName: ""
  wristbandHookImage: bitnami/kubectl:1.33.4-debian-12-r0@sha256:ed0b31a0508da84ee655c5c6e01bd3897fc56ad6cf69debb27fa1893a06d2246
  # The header the wristband leaves in. The default writes "Bearer <wristband>"
  # over the caller's credential; any other name carries the raw token, deletes the
  # caller's `authorization` after it, and is stripped from client requests.
  wristbandHeader: authorization

  # Set `policy: null` when the AuthConfigs come from elsewhere (an operator).
  policy:
    # At least one is required. Helmfile supplies the human provider.
    identityProviders: []
    # - name: human-jwt
    #   issuerUrl: https://idp.example.com/realms/hyperfleet
    #   allowInsecureIssuer: false # test-only mock issuer exception
    #   audience: hyperfleet-api
    #   identityClaim: sub
    #   identityClaimPattern: ""

    # Machine identity (adapters/sentinels) via kubernetesTokenReview.
    machineIdentity:
      # TokenReview audience. Required with no default: it must match the audience
      # the machine callers request their tokens for (Helmfile sets it).
      # audience: ""
      # Exact SA names, no wildcards; Helmfile derives the list from the deployed
      # sentinels and adapters. Empty denies every machine caller (fail-closed).
      allowedServiceAccounts: []

    # Active AuthConfig model (onprem|oracle). Keep in sync with base-api tenant dimensions.
    tenant:
      model: onprem

    # The signing Secret holds a PKCS#1 RSA key.pem, required by the pinned
    # Authorino version. The first listed key signs; make rotate-wristband-key
    # manages the list (it rotates the API gateway's key, release
    # hyperfleet-gateway).
    wristband:
      # Audience the upstream validates the wristband against. Required with no
      # default: it must match the upstream API's JWT audience (Helmfile sets it).
      # audience: ""
      # Wristband lifetime in seconds.
      tokenDuration: 300
      # Name of the key created on a fresh install. Rotated keys get new names
      # because the name is the JWT key ID.
      signingKeySecretName: hyperfleet-wristband-signing-key
      # Set only by make rotate-wristband-key, signer first. Empty keeps the keys
      # the AuthConfig already lists.
      signingKeys: []
