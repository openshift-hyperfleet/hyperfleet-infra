apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mock-oidc.fullname" . }}-ingress
  labels:
    {{- include "mock-oidc.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mock-oidc.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: token-helper
        # API mode validates direct human JWTs, so hyperfleet-api must fetch
        # the mock issuer's JWKS over TLS. Keep this scoped to the API release
        # rather than allowing every pod in the namespace.
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: api
              app.kubernetes.io/instance: hyperfleet-api
        - podSelector:
            matchLabels:
              control-plane: controller-manager
              authorino-resource: authorino
        # hyperfleet-e2e mints human tokens through the API server's service
        # proxy. On GKE that proxy reaches pods through konnectivity-agent in
        # kube-system; on kind the API server connects from the node.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: konnectivity-agent
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
