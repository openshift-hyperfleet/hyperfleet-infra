apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mock-oidc.fullname" . }}-ingress
  labels:
    {{- include "mock-oidc.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mock-oidc.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
