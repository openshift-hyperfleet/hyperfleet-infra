apiVersion: v1
kind: Service
metadata:
  name: {{ include "mock-oidc.fullname" . }}
  labels:
    {{- include "mock-oidc.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "mock-oidc.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
