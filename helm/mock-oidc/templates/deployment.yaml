apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mock-oidc.fullname" . }}
  labels:
    {{- include "mock-oidc.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "mock-oidc.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.tls.enabled }}
        checksum/tls: {{ .Values.tls.secretName | sha256sum }}
        {{- end }}
      labels:
        {{- include "mock-oidc.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mock-oidc
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: mock-oidc
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}@{{ .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: {{ ternary "https" "http" .Values.tls.enabled }}
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: JSON_CONFIG
              valueFrom:
                configMapKeyRef:
                  name: {{ include "mock-oidc.fullname" . }}
                  key: JSON_CONFIG
            - name: SERVER_PORT
              value: {{ .Values.service.port | quote }}
          readinessProbe:
            httpGet:
              path: /isalive
              port: {{ ternary "https" "http" .Values.tls.enabled }}
              scheme: {{ ternary "HTTPS" "HTTP" .Values.tls.enabled }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
          livenessProbe:
            httpGet:
              path: /isalive
              port: {{ ternary "https" "http" .Values.tls.enabled }}
              scheme: {{ ternary "HTTPS" "HTTP" .Values.tls.enabled }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.tls.enabled }}
            - name: tls
              mountPath: /etc/mock-oidc/tls
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ .Values.tls.secretName }}
            items:
              - key: keystore.p12
                path: keystore.p12
        {{- end }}
