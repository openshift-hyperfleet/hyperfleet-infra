# Example HyperFleet Adapter task configuration
params:

  - name: "clusterId"
    source: "event.id"
    type: "string"
    required: true

  - name: "generation"
    source: "event.generation"
    type: "int"
    required: true

  - name: "namespace"
    source: "env.NAMESPACE"
    type: "string"

  - name: "clusterStatus"
    source:
      api_call:
        method: "GET"
        url: "/clusters/{{ .clusterId }}"
        timeout: 10s
        retry_attempts: 3
        retry_backoff: "exponential"

  - name: "clusterName"
    source: "clusterStatus.name"

  - name: "generation"
    source: "clusterStatus.generation"

  - name: "is_deleting"
    source:
      expression: "clusterStatus.?deleted_time.hasValue()"

  - name: "clusterNotReconciled"
    source:
      expression: |
        clusterStatus.?status.?conditions.orValue([]).filter(c, c.type == "Reconciled").size() > 0
          ? clusterStatus.?status.?conditions.orValue([]).filter(c, c.type == "Reconciled")[0].status != "True"
          : true

  - name: "clusterReconciledTTL"
    source:
      expression: |
        (timestamp(now()) - timestamp(
          clusterStatus.?status.?conditions.orValue([]).filter(c, c.type == "Reconciled").size() > 0
            ? clusterStatus.?status.?conditions.orValue([]).filter(c, c.type == "Reconciled")[0].last_transition_time
            : now()
        )).getSeconds() > 300

# Preconditions with valid operators and CEL expressions
preconditions:
  - name: "validationCheck"
    # Precondition passes if cluster is NOT Reconciled OR if cluster is Reconciled and stable for >300 seconds since last transition (enables self-healing) OR if cluster is being deleted
    expression: |
      clusterNotReconciled || clusterReconciledTTL || is_deleting

# Resources with valid K8s manifests
resources:
  - name: "resource0"
    transport:
      client: "kubernetes"
    manifest:
      apiVersion: v1
      kind: ConfigMap
      data:
        cluster_id: "{{ .clusterId }}"
        cluster_name: "{{ .clusterName }}"
      metadata:
        name: "{{ .clusterId | lower }}-adapter1-configmap"
        namespace: "{{ .namespace }}"
        labels:
          app.kubernetes.io/component: adapter
          app.kubernetes.io/instance: adapter1
          app.kubernetes.io/name: hyperfleet-adapter
          app.kubernetes.io/version: 1.0.0
          app.kubernetes.io/transport: kubernetes
          hyperfleet.io/cluster-id: "{{ .clusterId }}"
          hyperfleet.io/cluster-name: "{{ .clusterName }}"
        annotations:
          hyperfleet.io/generation: "{{ .generation }}"
    discovery:
      namespace: "{{ .namespace }}"
      by_selectors:
        label_selector:
          hyperfleet.io/cluster-id: "{{ .clusterId }}"
          hyperfleet.io/cluster-name: "{{ .clusterName }}"
    lifecycle:
      delete:
        # Background propagation is appropriate for simple ConfigMap resources
        # without nested dependencies - allows faster deletion without waiting
        propagationPolicy: "Background"
        when:
          expression: "is_deleting"

# Post-processing with conditional payloads and post-actions using `when` gates.
# Two paths: normal (resources applied) and skipped (preconditions not met).
# The `when` condition on payloads prevents CEL evaluation of resources.* that
# don't exist in the skipped path. The `when` on post-actions provides an
# explicit gate — a post-action referencing a skipped payload would also be
# auto-skipped, but the explicit gate makes intent clear in the config.
post:
  payloads:
    # Normal path: resources were applied — report full resource-derived status
    - name: "statusPayload"
      when:
        expression: "!adapter.resourcesSkipped"
      build:
        adapter: "{{ .adapter.name }}"
        conditions:
          # Applied: ConfigMap successfully created in the target namespace
          - type: "Applied"
            status:
              expression: |
                resources.?resource0.?metadata.?creationTimestamp.hasValue() ? "True" : "False"
            reason:
              expression: |
                resources.?resource0.?metadata.?creationTimestamp.hasValue() ? "ConfigMapCreated" : "ConfigMapNotCreated"
            message:
              expression: |
                resources.?resource0.?metadata.?creationTimestamp.hasValue()
                  ? "ConfigMap created in namespace " + resources.resource0.metadata.namespace
                  : "ConfigMap has not been created yet"
          # Available: ConfigMap data keys are populated and accessible
          - type: "Available"
            status:
              expression: |
                resources.?resource0.?data.?cluster_id.hasValue() ? "True" : "False"
            reason:
              expression: |
                resources.?resource0.?data.?cluster_id.hasValue()
                  ? "ConfigMapDataPopulated"
                  : "ConfigMapDataMissing"
            message:
              expression: |
                resources.?resource0.?data.?cluster_id.hasValue()
                  ? "ConfigMap data keys are populated and accessible"
                  : "ConfigMap data keys are not yet populated"
          # Health: Adapter execution status (runtime)
          - type: "Health"
            status:
              expression: |
                adapter.?executionStatus.orValue("") == "success" ? "True" : (adapter.?executionStatus.orValue("") == "failed" ? "False" : "Unknown")
            reason:
              expression: |
                adapter.?errorReason.orValue("") != "" ? adapter.?errorReason.orValue("") : "Healthy"
            message:
              expression: |
                adapter.?errorMessage.orValue("") != "" ? adapter.?errorMessage.orValue("") : "All adapter operations completed successfully"
          # Finalized: Deletion lifecycle completion
          - type: "Finalized"
            status:
              expression: |
                !is_deleting
                  ? "False"
                  : (!resources.?resource0.hasValue()
                      ? "True"
                      : "False")
            reason:
              expression: |
                !is_deleting
                  ? "ResourceActive"
                  : (!resources.?resource0.hasValue()
                      ? "CleanupConfirmed"
                      : (adapter.?executionStatus.orValue("") == "failed"
                          ? "CleanupFailed"
                          : "CleanupInProgress"))
            message:
              expression: |
                !is_deleting
                  ? "Resource is active, not scheduled for deletion"
                  : (!resources.?resource0.hasValue()
                      ? "All resources deleted successfully"
                      : (adapter.?executionStatus.orValue("") == "failed"
                          ? "Deletion failed during adapter execution"
                          : "Deletion in progress"))
        observed_generation:
          expression: "generation"
        observed_time: "{{ now | date \"2006-01-02T15:04:05Z07:00\" }}"
        data:
          namespace:
            name:
              expression: |
                resources.?resource0.?metadata.?name.orValue("")
            creationTimestamp:
              expression: |
                resources.?resource0.?metadata.?creationTimestamp.orValue("")

    # Skipped path: preconditions not met — report simplified status without
    # evaluating resources.* (which may not exist in this context)
    - name: "skippedStatusPayload"
      when:
        expression: "adapter.resourcesSkipped"
      build:
        adapter: "{{ .adapter.name }}"
        conditions:
          - type: "Applied"
            status: "False"
            reason: "PreconditionsNotMet"
            message:
              expression: |
                "Resources skipped: " + adapter.?skipReason.orValue("preconditions not met")
          - type: "Available"
            status: "False"
            reason: "PreconditionsNotMet"
            message:
              expression: |
                "Resources not available: " + adapter.?skipReason.orValue("preconditions not met")
          - type: "Health"
            status: "True"
            reason: "NoErrors"
            message: "Adapter is healthy, no work performed due to preconditions"
          - type: "Finalized"
            status: "False"
            reason: "ResourceActive"
            message: "Resource is active, not scheduled for deletion"
        observed_generation:
          expression: "generation"
        observed_time: "{{ now | date \"2006-01-02T15:04:05Z07:00\" }}"

  post_actions:
    - name: "reportClusterStatus"
      when:
        expression: "!adapter.resourcesSkipped"
      api_call:
        method: "PUT"
        url: "/clusters/{{ .clusterId }}/statuses"
        headers:
          - name: "Content-Type"
            value: "application/json"
        body: "{{ .statusPayload }}"

    - name: "reportClusterStatusSkipped"
      when:
        expression: "adapter.resourcesSkipped"
      api_call:
        method: "PUT"
        url: "/clusters/{{ .clusterId }}/statuses"
        headers:
          - name: "Content-Type"
            value: "application/json"
        body: "{{ .skippedStatusPayload }}"
